<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Tourist — TOURISTMO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/main.css">
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">🌍 TOURISTMO</h2>
                        <p class="text-muted">Create a new tourist account</p>
                    </div>
                    <div id="alert-container"></div>
                    <form id="register-form">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastName" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="phone">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Register Account</button>
                    </form>
                    <div class="text-center mt-3">
                        <p class="small text-muted">Already have an account? <a href="login.html">Sign In</a></p>
                        <p class="small"><a href="index.html">&larr; Back to Home</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/js/api.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value;
            const alertContainer = document.getElementById('alert-container');
            alertContainer.innerHTML = '';

            try {
                await apiRequest('/auth/register', 'POST', { firstName, lastName, email, password, phone });
                alertContainer.innerHTML = `<div class="alert alert-success">Registration successful! Redirecting to login...</div>`;
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (err) {
                alertContainer.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
            }
        });
    </script>
</body>
</html>
