<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — TOURISTMO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/main.css">
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">🌍 TOURISTMO</h2>
                        <p class="text-muted">Sign in to your account</p>
                    </div>
                    <div id="alert-container"></div>
                    <form id="login-form">
                        <div class="mb-3">
                            <label for="role" class="form-label">User Role</label>
                            <select class="form-select" id="role" required>
                                <option value="tourist">Tourist</option>
                                <option value="admin">Administrator</option>
                                <option value="tour_guide">Tour Guide</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" required placeholder="e.g. juan@example.com">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required placeholder="Password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
                    </form>
                    <div class="text-center mt-3">
                        <p class="small text-muted">Don't have an account? <a href="register.html">Register as Tourist</a></p>
                        <p class="small"><a href="index.html">&larr; Back to Home</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/js/api.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const role = document.getElementById('role').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertContainer = document.getElementById('alert-container');
            alertContainer.innerHTML = '';

            try {
                const res = await apiRequest('/auth/login', 'POST', { email, password, role });
                localStorage.setItem('touristmo_token', res.data.token);
                localStorage.setItem('touristmo_role', res.data.role);
                localStorage.setItem('touristmo_user', JSON.stringify(res.data.user));

                // Redirect based on role
                if (res.data.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else if (res.data.role === 'tour_guide') {
                    window.location.href = 'guide-dashboard.html';
                } else {
                    window.location.href = 'tourist-dashboard.html';
                }
            } catch (err) {
                alertContainer.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
            }
        });
    </script>
</body>
</html>
